<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>快報 (kaihō) | дистро-секонд</title>
    <meta name="description" content="Кассеты на продажу. Каталог регулярно пополняется." />
    <link rel="icon" href="images/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="images/logo.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-art" aria-hidden="true">
      <img id="bgLogo" src="images/logo.png" alt="" />
    </div>

    <div class="page">
    <header class="header">
      <h1>快報 (kaihō) | дистро-секонд</h1>
      <p class="subtitle">
        каталог регулярно пополняется ·
        <a href="https://t.me/kaihotapes" target="_blank" rel="noopener noreferrer">тг-канал</a>
        ·
        <a href="https://t.me/xbulatx" target="_blank" rel="noopener noreferrer">написать</a>
      </p>
    </header>

    <section class="filters" aria-label="Фильтры">
      <label class="field grow">
        <span>Поиск</span>
        <input id="q" type="search" placeholder="название или лейбл" autocomplete="off" />
      </label>
      <label class="field">
        <span>Жанр</span>
        <select id="genre">
          <option value="">все</option>
        </select>
      </label>
      <label class="field">
        <span>Страна</span>
        <select id="country">
          <option value="">все</option>
        </select>
      </label>
      <label class="field">
        <span>Цена от</span>
        <input id="priceFrom" type="number" min="0" step="50" placeholder="—" />
      </label>
      <label class="field">
        <span>Цена до</span>
        <input id="priceTo" type="number" min="0" step="50" placeholder="—" />
      </label>
      <button id="reset" type="button" class="reset">Сбросить</button>
    </section>

    <p class="count" id="count" aria-live="polite"></p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Фото</th>
            <th>Название</th>
            <th>Жанры</th>
            <th>Год</th>
            <th>Страна</th>
            <th>Лейбл</th>
            <th>Цена</th>
            <th>Слушать</th>
            <th>Обзор</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="cards" id="cards" hidden></div>

    <footer class="footer">
      <p>
        каталог регулярно пополняется ·
        <a href="https://t.me/kaihotapes" target="_blank" rel="noopener noreferrer">тг-канал</a>
        ·
        <a href="https://t.me/xbulatx" target="_blank" rel="noopener noreferrer">написать</a>
      </p>
    </footer>
    </div>

    <div id="lightbox" class="lightbox" hidden>
      <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Закрыть">×</button>
      <img id="lightboxImg" alt="" />
      <p id="lightboxCaption" class="lightbox-caption"></p>
    </div>

    <script src="app.js"></script>
  </body>
</html>
